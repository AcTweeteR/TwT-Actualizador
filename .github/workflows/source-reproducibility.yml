name: Verify 0.4.29 reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rebuild:
    # The published XStream package was built with the macOS patch utility.
    # GNU patch on Ubuntu handles the pinned upstream CRLF source differently
    # and rejects a valid context hunk, so use the matching build environment.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch pinned XStream upstream asset
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Pesicp/XStreamPro/releases/download/1.1.2/plugin.video.xstream-pro-1.1.2.zip \
            --output "$RUNNER_TEMP/xstream-upstream.zip"
          echo '915f45708670d07e789bb73b7390a7b5cf30175f818ef5da8ea18c9f13f537fe  '"$RUNNER_TEMP/xstream-upstream.zip" | shasum -a 256 --check
      - name: Run source regression tests and rebuild add-on ZIPs and Kodi index
        working-directory: source/0.4.29
        run: |
          mkdir -p "$RUNNER_TEMP/actweeter-rebuild"
          python3 -m unittest discover -s tests -v
          python3 tools/build_repository_package.py --output "$RUNNER_TEMP/actweeter-rebuild/repository.actweeter-1.0.3.zip"
          python3 tools/build_skin_package.py --output "$RUNNER_TEMP/actweeter-rebuild/skin.actweeter-1.2.28.zip"
          python3 tools/build_service_package.py --output "$RUNNER_TEMP/actweeter-rebuild/service.actweeter-0.4.29.zip"
          python3 tools/build_xstream_package.py --upstream-zip "$RUNNER_TEMP/xstream-upstream.zip" --output "$RUNNER_TEMP/actweeter-rebuild/plugin.video.xstream-pro-1.1.2.7.zip"
          python3 tools/build_distribution_index.py \
            --repository-zip "$RUNNER_TEMP/actweeter-rebuild/repository.actweeter-1.0.3.zip" \
            --skin-zip "$RUNNER_TEMP/actweeter-rebuild/skin.actweeter-1.2.28.zip" \
            --service-zip "$RUNNER_TEMP/actweeter-rebuild/service.actweeter-0.4.29.zip" \
            --xstream-zip "$RUNNER_TEMP/actweeter-rebuild/plugin.video.xstream-pro-1.1.2.7.zip" \
            --output-dir "$RUNNER_TEMP/actweeter-rebuild/index"
      - name: Compare rebuilt historical packages with published artifacts
        run: |
          set -eu
          tmp="$RUNNER_TEMP/actweeter-rebuild"
          cmp "$tmp/repository.actweeter-1.0.3.zip" repo/repository.actweeter/repository.actweeter-1.0.3.zip
          cmp "$tmp/skin.actweeter-1.2.28.zip" repo/skin.actweeter/skin.actweeter-1.2.28.zip
          cmp "$tmp/service.actweeter-0.4.29.zip" repo/service.actweeter/service.actweeter-0.4.29.zip
          cmp "$tmp/plugin.video.xstream-pro-1.1.2.7.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.7.zip
          # This workflow rebuilds the immutable 0.4.29 snapshot. The root
          # Kodi feed advances independently; its current index/hash and
          # versions are checked by the current-distribution workflow.
