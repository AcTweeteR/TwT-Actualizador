name: Verify XStream Catalog Candidate

on:
  pull_request:
    paths:
      - 'docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36~beta3.zip'
      - 'docs/testing/repo/addons.xml'
      - 'source/0.4.32/**'
      - '.github/workflows/xstream-widget-performance.yml'
  push:
    branches: [main]
    paths:
      - 'docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36~beta3.zip'
      - 'docs/testing/repo/addons.xml'
      - 'source/0.4.32/**'
      - '.github/workflows/xstream-widget-performance.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only Python dependencies
        run: python3 -m pip install --disable-pip-version-check pytest requests
      - name: Fetch and verify pinned XStream upstream fixture
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Pesicp/XStreamPro/releases/download/1.1.2/plugin.video.xstream-pro-1.1.2.zip \
            --output "$RUNNER_TEMP/xstream-upstream-1.1.2.zip"
          echo '915f45708670d07e789bb73b7390a7b5cf30175f818ef5da8ea18c9f13f537fe  '"$RUNNER_TEMP/xstream-upstream-1.1.2.zip" | shasum -a 256 -c -
      - name: Run catalog, concurrency and prefetch regression tests
        env:
          ACTWEETER_XSTREAM_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36~beta3.zip
          ACTWEETER_XSTREAM_TEST_ZIP: ${{ github.workspace }}/docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36~beta3.zip
          ACTWEETER_XSTREAM_UPSTREAM_ZIP: ${{ runner.temp }}/xstream-upstream-1.1.2.zip
          ACTWEETER_SKIN_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/skin.actweeter/skin.actweeter-1.2.36~beta2.zip
          ACTWEETER_SERVICE_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/service.actweeter/service.actweeter-0.4.94~beta3.zip
          ACTWEETER_BETA_INDEX: ${{ github.workspace }}/docs/testing/repo/addons.xml
          ACTWEETER_RELEASE_CHANNEL: beta
        # Beta26 must not reconstruct Stable, even in a temporary test directory.
        run: >-
          python3 -m pytest -q -rs source/0.4.32/tests
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_20261021_manifest_and_retained_packages
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_reproducible_create_only_promotion
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_release_versions_hashes_and_checksum
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_stable_package_builder_deterministic_and_create_only
      - name: Rebuild package from exact verified upstream archive
        run: |
          python3 source/0.4.32/tools/build_xstream_package.py \
            --upstream-zip "$RUNNER_TEMP/xstream-upstream-1.1.2.zip" \
            --output "$RUNNER_TEMP/plugin.video.xstream-pro-1.1.2.36~beta3.zip"
          cmp "$RUNNER_TEMP/plugin.video.xstream-pro-1.1.2.36~beta3.zip" \
            docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36~beta3.zip
      - name: Verify immutable Stable channel remains unchanged
        run: git diff --exit-code origin/main...HEAD -- repo/
