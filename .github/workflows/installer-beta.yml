name: Verify current AcTweeteR Beta installer
on:
  push:
    branches: [main, codex/beta-installer-0.4.39, codex/tvos-autoplay-skin-wiring, codex/startup-skinshortcuts-idempotence, codex/testing-beta-channel-isolation]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer and channel-isolation tests
        run: |
          python3 -m unittest discover -s source/0.4.32/tests -v
      - name: Verify isolated Beta feed and immutable dependencies
        run: |
          python3 tools/build_test_channel.py \
            --service-zip docs/testing/repo/service.actweeter/service.actweeter-0.4.44.zip \
            --skin-zip docs/testing/repo/skin.actweeter/skin.actweeter-1.2.30~beta2.zip \
            --xstream-zip docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.10.zip \
            --output "$RUNNER_TEMP/testing"
          cmp "$RUNNER_TEMP/testing/repo/addons.xml" docs/testing/repo/addons.xml
          cmp "$RUNNER_TEMP/testing/repo/addons.xml.md5" docs/testing/repo/addons.xml.md5
          cmp "$RUNNER_TEMP/testing/bootstrap/repository.actweeter.testing-1.0.2.zip" docs/testing/bootstrap/repository.actweeter.testing-1.0.2.zip
          cmp "$RUNNER_TEMP/testing/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.2.zip" docs/testing/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.2.zip
          git diff --exit-code origin/main...HEAD -- repo/
