name: Verify current AcTweeteR Beta installer
on:
  push:
    branches: [main, codex/beta-installer-0.4.39, codex/tvos-autoplay-skin-wiring, codex/startup-skinshortcuts-idempotence, codex/testing-beta-channel-isolation]
  pull_request:
  workflow_dispatch:
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test-only Python dependencies
        run: python3 -m pip install --disable-pip-version-check pytest requests
      - name: Fetch and verify pinned XStream upstream fixture
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Pesicp/XStreamPro/releases/download/1.1.2/plugin.video.xstream-pro-1.1.2.zip \
            --output "$RUNNER_TEMP/xstream-upstream-1.1.2.zip"
          echo '915f45708670d07e789bb73b7390a7b5cf30175f818ef5da8ea18c9f13f537fe  '"$RUNNER_TEMP/xstream-upstream-1.1.2.zip" | shasum -a 256 -c -
      - name: Installer and channel-isolation tests
        env:
          ACTWEETER_XSTREAM_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.44~beta8.zip
          ACTWEETER_XSTREAM_TEST_ZIP: ${{ github.workspace }}/docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.44~beta8.zip
          ACTWEETER_XSTREAM_UPSTREAM_ZIP: ${{ runner.temp }}/xstream-upstream-1.1.2.zip
          ACTWEETER_SKIN_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta10.zip
          ACTWEETER_SERVICE_LIVE_ZIP: ${{ github.workspace }}/docs/testing/repo/service.actweeter/service.actweeter-0.4.101~beta6.zip
          ACTWEETER_BETA_INDEX: ${{ github.workspace }}/docs/testing/repo/addons.xml
          ACTWEETER_RELEASE_CHANNEL: beta
        # Priority Beta must not reconstruct Stable, even in a temporary test directory.
        run: >-
          python3 -m pytest -q -rs source/0.4.32/tests
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_20261021_manifest_and_retained_packages
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_reproducible_create_only_promotion
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_release_versions_hashes_and_checksum
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_stable_package_builder_deterministic_and_create_only
      - name: Verify historical Touch Beta1 and current Touch Beta2 without replacing Stable
        run: |
          python3 tools/build_touch_skin_beta.py --output "$RUNNER_TEMP/skin.actweeter-1.2.41~beta1.zip"
          cmp "$RUNNER_TEMP/skin.actweeter-1.2.41~beta1.zip" docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta1.zip
          python3 tools/build_touch_refinement_beta.py --output "$RUNNER_TEMP/skin.actweeter-1.2.41~beta2.zip"
          cmp "$RUNNER_TEMP/skin.actweeter-1.2.41~beta2.zip" docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta2.zip
          python3 tools/build_touch_native_beta3.py --output "$RUNNER_TEMP/skin.actweeter-1.2.41~beta3.zip"
          cmp "$RUNNER_TEMP/skin.actweeter-1.2.41~beta3.zip" docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta3.zip
          python3 tools/build_epg_watched_perf_beta.py --output "$RUNNER_TEMP/epg-watched-perf-beta"
          cmp "$RUNNER_TEMP/epg-watched-perf-beta/skin.actweeter-1.2.41~beta4.zip" docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta4.zip
          cmp "$RUNNER_TEMP/epg-watched-perf-beta/plugin.video.xstream-pro-1.1.2.40~beta2.zip" docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.40~beta2.zip
          python3 tools/verify_current_stable.py
      # Historical Beta4 is immutable; Beta5 legitimately replaces the current
      # source module. Never regenerate an old release from moving sources.
      - name: Verify immutable Service Beta5 archive
        run: |
          python3 -c 'import zipfile,xml.etree.ElementTree as E; p="docs/testing/repo/service.actweeter/service.actweeter-0.4.101~beta5.zip"; z=zipfile.ZipFile(p); assert z.testzip() is None; assert E.fromstring(z.read("service.actweeter/addon.xml")).get("version")=="0.4.101~beta5"'
      - name: Verify immutable Service Beta6 and Skin Beta10 archives
        run: |
          python3 - <<'PYTEST'
          import zipfile
          from xml.etree import ElementTree as ET
          from pathlib import Path
          for aid, ver in [('service.actweeter','0.4.101~beta6'), ('skin.actweeter','1.2.41~beta10')]:
              path = Path('docs/testing/repo') / aid / f'{aid}-{ver}.zip'
              with zipfile.ZipFile(path) as archive:
                  assert archive.testzip() is None
                  assert ET.fromstring(archive.read(aid+'/addon.xml')).get('version') == ver
          PYTEST
      - name: Verify isolated Beta feed and immutable dependencies
        run: |
          python3 tools/build_test_channel.py \
            --service-zip docs/testing/repo/service.actweeter/service.actweeter-0.4.101~beta6.zip \
            --skin-zip docs/testing/repo/skin.actweeter/skin.actweeter-1.2.41~beta10.zip \
            --xstream-zip docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.44~beta8.zip \
            --rivulet-repository-zip source/0.4.32/third_party/rivulet/repository.rivulet-1.0.2.zip \
            --iagl-repository-zip source/0.4.32/third_party/iagl/repository.zachmorris-1.0.4.zip \
            --output "$RUNNER_TEMP/testing"
          # The archived installer builds an immutable historic Beta feed; a newer
          # WorldTV Beta must not be compared byte-for-byte with that snapshot.
          python3 - <<'PYTEST'
          from pathlib import Path
          from xml.etree import ElementTree as ET
          import hashlib
          live = Path('docs/testing/repo/addons.xml')
          payload = live.read_bytes()
          assert hashlib.md5(payload).hexdigest() == (live.parent / 'addons.xml.md5').read_text().strip()
          versions = {a.get('id'):a.get('version') for a in ET.fromstring(payload)}
          assert versions['skin.actweeter'] == '1.2.43~beta3'
          assert versions['service.actweeter'] == '0.4.103~beta1'
          assert versions['plugin.video.launcherm3u'] == '1.3.3~beta1'
          for addon_id, version in versions.items():
              artifact = live.parent / addon_id / f'{addon_id}-{version}.zip'
              assert artifact.is_file(), artifact
          PYTEST
          cmp "$RUNNER_TEMP/testing/bootstrap/index.html" docs/testing/bootstrap/index.html
          cmp "$RUNNER_TEMP/testing/bootstrap/repository.actweeter.testing-1.0.2.zip" docs/testing/bootstrap/repository.actweeter.testing-1.0.2.zip
          cmp "$RUNNER_TEMP/testing/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.2.zip" docs/testing/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.2.zip
          # Beta build must leave the currently published Stable packages intact.
          python3 tools/verify_current_stable.py
