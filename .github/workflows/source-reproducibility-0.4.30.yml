name: Verify AcTweeteR 0.4.30 reproducibility

on:
  push:
    branches: [main]
    paths:
      - "source/0.4.30/**"
      - "repo/repository.actweeter/repository.actweeter-1.0.3.zip"
      - "repo/skin.actweeter/skin.actweeter-1.2.28.zip"
      - "repo/service.actweeter/service.actweeter-0.4.30.zip"
      - "repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.7.zip"
  pull_request:
    paths:
      - "source/0.4.30/**"
      - "repo/repository.actweeter/repository.actweeter-1.0.3.zip"
      - "repo/skin.actweeter/skin.actweeter-1.2.28.zip"
      - "repo/service.actweeter/service.actweeter-0.4.30.zip"
      - "repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.7.zip"
  workflow_dispatch:

jobs:
  rebuild:
    # Match the macOS patch behavior used for the pinned upstream CRLF archive.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch and verify pinned upstream XStream
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Pesicp/XStreamPro/releases/download/1.1.2/plugin.video.xstream-pro-1.1.2.zip \
            --output "$RUNNER_TEMP/xstream-upstream.zip"
          echo '915f45708670d07e789bb73b7390a7b5cf30175f818ef5da8ea18c9f13f537fe  '"$RUNNER_TEMP/xstream-upstream.zip" | shasum -a 256 --check
      - name: Run tests and rebuild distribution
        working-directory: source/0.4.30
        run: |
          mkdir -p "$RUNNER_TEMP/actweeter-0.4.30"
          python3 -m unittest discover -s tests -v
          python3 tools/build_repository_package.py --output "$RUNNER_TEMP/actweeter-0.4.30/repository.actweeter-1.0.3.zip"
          python3 tools/build_skin_package.py --output "$RUNNER_TEMP/actweeter-0.4.30/skin.actweeter-1.2.28.zip"
          python3 tools/build_service_package.py --output "$RUNNER_TEMP/actweeter-0.4.30/service.actweeter-0.4.30.zip"
          python3 tools/build_xstream_package.py --upstream-zip "$RUNNER_TEMP/xstream-upstream.zip" --output "$RUNNER_TEMP/actweeter-0.4.30/plugin.video.xstream-pro-1.1.2.7.zip"
          python3 tools/build_distribution_index.py \
            --repository-zip "$RUNNER_TEMP/actweeter-0.4.30/repository.actweeter-1.0.3.zip" \
            --skin-zip "$RUNNER_TEMP/actweeter-0.4.30/skin.actweeter-1.2.28.zip" \
            --service-zip "$RUNNER_TEMP/actweeter-0.4.30/service.actweeter-0.4.30.zip" \
            --xstream-zip "$RUNNER_TEMP/actweeter-0.4.30/plugin.video.xstream-pro-1.1.2.7.zip" \
            --output-dir "$RUNNER_TEMP/actweeter-0.4.30/index"
      - name: Compare built packages and Kodi index
        run: |
          set -eu
          tmp="$RUNNER_TEMP/actweeter-0.4.30"
          cmp "$tmp/repository.actweeter-1.0.3.zip" repo/repository.actweeter/repository.actweeter-1.0.3.zip
          cmp "$tmp/skin.actweeter-1.2.28.zip" repo/skin.actweeter/skin.actweeter-1.2.28.zip
          cmp "$tmp/service.actweeter-0.4.30.zip" repo/service.actweeter/service.actweeter-0.4.30.zip
          cmp "$tmp/plugin.video.xstream-pro-1.1.2.7.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.7.zip
          cmp "$tmp/index/addons.xml" repo/addons.xml
          cmp "$tmp/index/addons.xml.md5" repo/addons.xml.md5
