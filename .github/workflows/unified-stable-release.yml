name: Verify current AcTweeteR Stable release

on:
  pull_request:
    paths:
      - 'repo/**'
      - 'tools/build_stable_channel.py'
      - 'tools/build_stable_20261021.py'
      - 'manifests/actweeter-stable-20261021.json'
      - 'manifests/actweeter-stable-rivulet-iagl-20261025.json'
      - 'manifests/actweeter-stable-beta34-20261027.json'
      - 'manifests/actweeter-stable-beta35-20261027.json'
      - 'manifests/actweeter-stable-beta37-20261028.json'
      - 'tools/promote_beta37_stable.py'
      - 'tools/promote_beta6_stable.py'
      - 'manifests/actweeter-stable-beta6-20261104.json'
      - 'manifests/actweeter-beta6-20261104.json'
      - 'manifests/archive/**'
      - 'tools/verify_current_stable.py'
      - 'tools/promote_priority_stable.py'
      - 'manifests/actweeter-stable-priority-20261104.json'
      - 'tools/promote_epg_watched_perf_stable.py'
      - 'tools/promote_stabilization_stable.py'
      - 'tools/promote_trakt_persistence_stable.py'
      - 'manifests/actweeter-stable-trakt-persistence-20261105.json'
      - 'manifests/archive/trakt-persistence-prior-stable-addons-20261105.xml'
      - 'manifests/actweeter-stable-stabilization-20261105.json'
      - 'manifests/actweeter-stable-epg-watched-performance-20261105.json'
      - 'manifests/archive/beta6-stable-addons.xml'
      - 'tools/promote_beta34_stable.py'
      - 'tools/promote_beta35_stable.py'
      - 'source/0.4.32/**'
      - 'manifests/unified-stable-20261020.json'
      - '.github/workflows/unified-stable-release.yml'
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-current-stable:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test-only Python dependencies
        run: python3 -m pip install --disable-pip-version-check pytest requests
      - name: Fetch and verify pinned XStream upstream fixture
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Pesicp/XStreamPro/releases/download/1.1.2/plugin.video.xstream-pro-1.1.2.zip \
            --output "$RUNNER_TEMP/xstream-upstream-1.1.2.zip"
          echo '915f45708670d07e789bb73b7390a7b5cf30175f818ef5da8ea18c9f13f537fe  '"$RUNNER_TEMP/xstream-upstream-1.1.2.zip" | shasum -a 256 -c -
      - name: Regression tests, mandatory release checks and security contract
        env:
          ACTWEETER_RELEASE_CHANNEL: stable
          ACTWEETER_XSTREAM_LIVE_ZIP: ${{ github.workspace }}/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.42.zip
          ACTWEETER_XSTREAM_TEST_ZIP: ${{ github.workspace }}/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.42.zip
          ACTWEETER_SKIN_LIVE_ZIP: ${{ github.workspace }}/repo/skin.actweeter/skin.actweeter-1.2.41.zip
          ACTWEETER_SERVICE_LIVE_ZIP: ${{ github.workspace }}/repo/service.actweeter/service.actweeter-0.4.99.zip
          ACTWEETER_BETA_INDEX: ${{ github.workspace }}/docs/testing/repo/addons.xml
          ACTWEETER_XSTREAM_UPSTREAM_ZIP: ${{ runner.temp }}/xstream-upstream-1.1.2.zip
        run: >-
          python3 -m pytest -q -rs source/0.4.32/tests
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_20261021_manifest_and_retained_packages
          --deselect source/0.4.32/tests/test_stable_20261021_release.py::StableOctober21ReleaseTests::test_reproducible_create_only_promotion
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_release_versions_hashes_and_checksum
          --deselect source/0.4.32/tests/test_unified_stable_release.py::UnifiedStableReleaseTests::test_stable_package_builder_deterministic_and_create_only
      - name: Verify immutable historical Stable 2026-10-20 release
        run: |
          set -eu
          python3 tools/build_stable_channel.py --output-dir "$RUNNER_TEMP/actweeter-stable"
          cmp "$RUNNER_TEMP/actweeter-stable/skin.actweeter-1.2.30.zip" repo/skin.actweeter/skin.actweeter-1.2.30.zip
          python3 -c 'import json,hashlib,pathlib,sys; m=json.loads(pathlib.Path("manifests/unified-stable-20261020.json").read_text()); b=pathlib.Path(sys.argv[1]).read_bytes(); assert hashlib.sha256(b).hexdigest()==m["index_sha256"]; assert hashlib.md5(b).hexdigest()==m["index_md5"]' "$RUNNER_TEMP/actweeter-stable/addons.xml"
          cmp docs/testing/repo/service.actweeter/service.actweeter-0.4.45.zip repo/service.actweeter/service.actweeter-0.4.45.zip
          cmp docs/testing/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.10.zip repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.10.zip

  verify-new-stable:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify current Stable manifest and historical promotion
        run: |
          set -eu
          python3 tools/verify_current_stable.py
          python3 -m unittest discover -s source/0.4.32/tests -p 'test_stable_20261021_release.py' -q
      - name: Rebuild historical Beta34 and current Beta35 Stable promotions
        run: |
          set -eu
          python3 tools/promote_beta34_stable.py --output-dir "$RUNNER_TEMP/stable-beta34"
          cmp "$RUNNER_TEMP/stable-beta34/repo/addons.xml" manifests/archive/beta34-stable-addons.xml
          cmp "$RUNNER_TEMP/stable-beta34/manifest.json" manifests/actweeter-stable-beta34-20261027.json
          cmp "$RUNNER_TEMP/stable-beta34/repo/skin.actweeter/skin.actweeter-1.2.36.zip" repo/skin.actweeter/skin.actweeter-1.2.36.zip
          cmp "$RUNNER_TEMP/stable-beta34/repo/service.actweeter/service.actweeter-0.4.94.zip" repo/service.actweeter/service.actweeter-0.4.94.zip
          cmp "$RUNNER_TEMP/stable-beta34/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.36.zip
          python3 -c 'import sys; from pathlib import Path; sys.path.insert(0, "tools"); import promote_beta35_stable; promote_beta35_stable.build(Path(sys.argv[1]))' "$RUNNER_TEMP/stable-beta35"
          cmp "$RUNNER_TEMP/stable-beta35/repo/addons.xml" manifests/archive/beta35-stable-addons.xml
          python3 -c 'import hashlib, pathlib; b=pathlib.Path("manifests/archive/beta35-stable-addons.xml").read_bytes(); assert hashlib.md5(b).hexdigest() == pathlib.Path("${{ runner.temp }}/stable-beta35/repo/addons.xml.md5").read_text().strip()'
          cmp "$RUNNER_TEMP/stable-beta35/manifest.json" manifests/actweeter-stable-beta35-20261027.json
          cmp "$RUNNER_TEMP/stable-beta35/repo/skin.actweeter/skin.actweeter-1.2.37.zip" repo/skin.actweeter/skin.actweeter-1.2.37.zip
          cmp "$RUNNER_TEMP/stable-beta35/repo/service.actweeter/service.actweeter-0.4.95.zip" repo/service.actweeter/service.actweeter-0.4.95.zip
          cmp "$RUNNER_TEMP/stable-beta35/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.37.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.37.zip

      - name: Rebuild current Beta37 Stable promotion
        run: |
          set -eu
          python3 tools/promote_beta37_stable.py --output-dir "$RUNNER_TEMP/stable-beta37"
          cmp "$RUNNER_TEMP/stable-beta37/repo/addons.xml" manifests/archive/beta37-stable-addons.xml
          python3 -c 'import hashlib,pathlib; assert hashlib.md5(pathlib.Path("manifests/archive/beta37-stable-addons.xml").read_bytes()).hexdigest()==pathlib.Path("${{ runner.temp }}/stable-beta37/repo/addons.xml.md5").read_text().strip()'
          cmp "$RUNNER_TEMP/stable-beta37/manifest.json" manifests/actweeter-stable-beta37-20261028.json
          cmp "$RUNNER_TEMP/stable-beta37/repo/skin.actweeter/skin.actweeter-1.2.38.zip" repo/skin.actweeter/skin.actweeter-1.2.38.zip
          cmp "$RUNNER_TEMP/stable-beta37/repo/service.actweeter/service.actweeter-0.4.96.zip" repo/service.actweeter/service.actweeter-0.4.96.zip
          cmp "$RUNNER_TEMP/stable-beta37/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.38.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.38.zip

      - name: Rebuild current Beta6 Stable promotion
        run: |
          set -eu
          python3 tools/promote_beta6_stable.py --output-dir "$RUNNER_TEMP/stable-beta6"
          cmp "$RUNNER_TEMP/stable-beta6/manifest.json" manifests/actweeter-stable-beta6-20261104.json
          cmp "$RUNNER_TEMP/stable-beta6/repo/addons.xml" manifests/archive/beta6-stable-addons.xml
          python3 -c 'import hashlib,pathlib,sys; b=pathlib.Path("manifests/archive/beta6-stable-addons.xml").read_bytes(); assert hashlib.md5(b).hexdigest()==pathlib.Path(sys.argv[1]).read_text().strip()' "$RUNNER_TEMP/stable-beta6/repo/addons.xml.md5"
          cmp "$RUNNER_TEMP/stable-beta6/repo/skin.actweeter/skin.actweeter-1.2.39.zip" repo/skin.actweeter/skin.actweeter-1.2.39.zip
          cmp "$RUNNER_TEMP/stable-beta6/repo/service.actweeter/service.actweeter-0.4.97.zip" repo/service.actweeter/service.actweeter-0.4.97.zip
          cmp "$RUNNER_TEMP/stable-beta6/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.39.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.39.zip

      - name: Rebuild and verify immutable historical priority Stable publication
        run: |
          set -eu
          python3 tools/promote_priority_stable.py --output-dir "$RUNNER_TEMP/stable-priority"
          cmp "$RUNNER_TEMP/stable-priority/manifest.json" manifests/actweeter-stable-priority-20261104.json
          cmp "$RUNNER_TEMP/stable-priority/repo/addons.xml" manifests/archive/priority-stable-addons-20261104.xml
          python3 -c 'import hashlib,pathlib,sys; b=pathlib.Path("manifests/archive/priority-stable-addons-20261104.xml").read_bytes(); assert hashlib.md5(b).hexdigest()==pathlib.Path(sys.argv[1]).read_text().strip()' "$RUNNER_TEMP/stable-priority/repo/addons.xml.md5"
          cmp "$RUNNER_TEMP/stable-priority/repo/skin.actweeter/skin.actweeter-1.2.40.zip" repo/skin.actweeter/skin.actweeter-1.2.40.zip
          cmp "$RUNNER_TEMP/stable-priority/repo/service.actweeter/service.actweeter-0.4.98.zip" repo/service.actweeter/service.actweeter-0.4.98.zip
          cmp "$RUNNER_TEMP/stable-priority/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.40.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.40.zip

      - name: Rebuild and verify current EPG watched performance Stable publication
        run: |
          set -eu
          python3 tools/promote_epg_watched_perf_stable.py --output-dir "$RUNNER_TEMP/stable-epg-watched-perf"
          cmp "$RUNNER_TEMP/stable-epg-watched-perf/manifest.json" manifests/actweeter-stable-epg-watched-performance-20261105.json
          cmp "$RUNNER_TEMP/stable-epg-watched-perf/repo/addons.xml" manifests/archive/epg-watched-perf-stable-addons-20261105.xml
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("manifests/archive/epg-watched-perf-stable-addons-20261105.xml").read_bytes(); assert hashlib.md5(p).hexdigest()==pathlib.Path("${{ runner.temp }}/stable-epg-watched-perf/repo/addons.xml.md5").read_text().strip()'
          cmp "$RUNNER_TEMP/stable-epg-watched-perf/repo/skin.actweeter/skin.actweeter-1.2.41.zip" repo/skin.actweeter/skin.actweeter-1.2.41.zip
          cmp "$RUNNER_TEMP/stable-epg-watched-perf/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.41.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.41.zip
          cmp "$RUNNER_TEMP/stable-epg-watched-perf/repo/skin.actweeter/changelog-1.2.41.txt" repo/skin.actweeter/changelog-1.2.41.txt

      - name: Rebuild current Service 0.4.99 Stable promotion
        run: |
          set -eu
          python3 tools/promote_stabilization_stable.py "$RUNNER_TEMP/stable-stabilization-099"
          cmp "$RUNNER_TEMP/stable-stabilization-099/manifest.json" manifests/actweeter-stable-stabilization-20261105.json
          cmp "$RUNNER_TEMP/stable-stabilization-099/repo/addons.xml" manifests/archive/trakt-persistence-prior-stable-addons-20261105.xml
          python3 -c 'import hashlib,pathlib; p=pathlib.Path("manifests/archive/trakt-persistence-prior-stable-addons-20261105.xml").read_bytes(); assert hashlib.md5(p).hexdigest()==pathlib.Path("${{ runner.temp }}/stable-stabilization-099/repo/addons.xml.md5").read_text().strip()'
          cmp "$RUNNER_TEMP/stable-stabilization-099/repo/service.actweeter/service.actweeter-0.4.99.zip" repo/service.actweeter/service.actweeter-0.4.99.zip
          cmp "$RUNNER_TEMP/stable-stabilization-099/repo/service.actweeter/changelog-0.4.99.txt" repo/service.actweeter/changelog-0.4.99.txt
          python3 tools/verify_current_stable.py

      - name: Rebuild current Trakt persistence Stable XStream
        run: |
          set -eu
          python3 tools/promote_trakt_persistence_stable.py "$RUNNER_TEMP/stable-trakt-persistence"
          cmp "$RUNNER_TEMP/stable-trakt-persistence/manifest.json" manifests/actweeter-stable-trakt-persistence-20261105.json
          cmp "$RUNNER_TEMP/stable-trakt-persistence/repo/addons.xml" repo/addons.xml
          cmp "$RUNNER_TEMP/stable-trakt-persistence/repo/addons.xml.md5" repo/addons.xml.md5
          cmp "$RUNNER_TEMP/stable-trakt-persistence/repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.42.zip" repo/plugin.video.xstream-pro/plugin.video.xstream-pro-1.1.2.42.zip
          python3 tools/verify_current_stable.py
