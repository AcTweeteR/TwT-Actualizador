name: Verify AcTweeteR Beta10 test-feed reproducibility

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run candidate tests and build isolated feed
        run: |
          set -eu
          tmp="$RUNNER_TEMP/actweeter-beta10"
          mkdir -p "$tmp"
          python3 -m unittest discover -s source/0.4.32/tests -v
          python3 source/0.4.32/tools/build_service_package.py \
            --output "$tmp/service.actweeter-0.4.37.zip"
          python3 source/0.4.32/tools/build_skin_package.py \
            --output "$tmp/skin.actweeter-1.2.29~beta10.zip"
          python3 tools/build_test_channel.py \
            --service-zip "$tmp/service.actweeter-0.4.37.zip" \
            --skin-zip "$tmp/skin.actweeter-1.2.29~beta10.zip" \
            --output "$tmp/testing"
      - name: Compare Beta 10 package artifacts and historical index hashes
        run: |
          set -eu
          tmp="$RUNNER_TEMP/actweeter-beta10/testing"
          cmp "$tmp/bootstrap/repository.actweeter.testing-1.0.0.zip" \
            docs/testing/bootstrap/repository.actweeter.testing-1.0.0.zip
          cmp "$tmp/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.0.zip" \
            docs/testing/repo/repository.actweeter.testing/repository.actweeter.testing-1.0.0.zip
          cmp "$tmp/repo/service.actweeter/service.actweeter-0.4.37.zip" \
            docs/testing/repo/service.actweeter/service.actweeter-0.4.37.zip
          cmp "$tmp/repo/skin.actweeter/skin.actweeter-1.2.29~beta10.zip" \
            docs/testing/repo/skin.actweeter/skin.actweeter-1.2.29~beta10.zip
          cmp "$tmp/bootstrap/index.html" docs/testing/bootstrap/index.html
          python3 - "$tmp/repo/addons.xml" "$tmp/repo/addons.xml.md5" <<'PY'
          import hashlib, json, pathlib, sys
          manifest = json.loads(pathlib.Path("manifests/0.4.37-beta10.json").read_text())
          payload = pathlib.Path(sys.argv[1]).read_bytes()
          md5_file = pathlib.Path(sys.argv[2]).read_text().strip()
          assert hashlib.sha256(payload).hexdigest() == manifest["testing_index"]["sha256"]
          assert hashlib.md5(payload).hexdigest() == manifest["testing_index"]["md5"]
          assert md5_file == manifest["testing_index"]["md5"]
          PY
